# Opt in with -f docker-compose.yml -f examples/handler-job/compose.yml.
# Replace every executor replica so all members register the custom handler.
services:
  executor:
    image: distributed-job-scheduler-handler-job:local
    build:
      args:
        PACKAGE: ./examples/handler-job

  handler-job:
    profiles: [examples]
    image: distributed-job-scheduler-handler-job:local
    build:
      context: .
      args:
        PACKAGE: ./examples/handler-job
    command: ["-schedule", "-api-url=http://api:8080"]
    environment:
      API_KEY: ${API_KEY:-scheduler-local}
    restart: "no"
