# Use with docker-compose.yml and project scheduler-bench (see make bench).
name: scheduler-bench

services:
  postgres:
    command:
      - postgres
      - -c
      - synchronous_commit=${BENCH_SYNCHRONOUS_COMMIT:-on}
      - -c
      - shared_buffers=${BENCH_SHARED_BUFFERS:-128MB}
      - -c
      - max_wal_size=${BENCH_MAX_WAL_SIZE:-1GB}
      - -c
      - fsync=on

  topic-init:
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 1; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.run --partitions ${BENCH_PARTITIONS:-12} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.dlq --partitions 3 --replication-factor 1

  migrate:
    image: distributed-job-scheduler-migrate:bench

  api:
    image: distributed-job-scheduler-api:bench
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/${POSTGRES_DB:-scheduler}?sslmode=disable&pool_max_conns=${BENCH_DB_POOL_MAX_CONNS:-12}
    ports: !override
      - "127.0.0.1:18080:8080"

  watcher:
    image: distributed-job-scheduler-watcher:bench
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/${POSTGRES_DB:-scheduler}?sslmode=disable&pool_max_conns=${BENCH_DB_POOL_MAX_CONNS:-12}
      WATCHER_BATCH_SIZE: ${WATCHER_BATCH_SIZE:-1000}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-100}
      KAFKA_BATCH_TIMEOUT: ${KAFKA_BATCH_TIMEOUT:-5ms}
    deploy:
      replicas: ${BENCH_WATCHERS:-2}

  executor:
    image: distributed-job-scheduler-executor:bench
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/${POSTGRES_DB:-scheduler}?sslmode=disable&pool_max_conns=${BENCH_DB_POOL_MAX_CONNS:-12}
    deploy:
      replicas: ${BENCH_EXECUTORS:-3}

  prometheus:
    ports: !override
      - "127.0.0.1:19090:9090"

  grafana:
    ports: !override
      - "127.0.0.1:13000:3000"

  k6:
    profiles: [tools]
    image: grafana/k6:1.6.1
    environment:
      API_KEY: ${API_KEY:-scheduler-local}
    volumes:
      - ./test/load:/scripts:ro
      - ${BENCH_RESULTS_DIR:-./docs/bench/results}:/results
    restart: "no"
