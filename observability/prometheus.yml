global:
  scrape_interval: 5s
  scrape_timeout: 4s

# Docker DNS returns every replica's address. A static service-name target would
# resolve to just one replica on each connection and mix its counter samples.
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: watcher
    dns_sd_configs:
      - names: [watcher]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: executor
    dns_sd_configs:
      - names: [executor]
        type: A
        port: 8080
        refresh_interval: 5s
